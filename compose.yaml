services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lista_tarefas}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://banco:5432/${DB_NAME:-lista_tarefas}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      banco:
        condition: service_healthy

  banco-teste:
    image: postgres:17-alpine
    profiles: ["testes"]
    environment:
      POSTGRES_DB: ${DB_TEST_NAME:-lista_tarefas_test}
      POSTGRES_USER: ${DB_TEST_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dados-postgres:
